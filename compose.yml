services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: csv_manager
      DB_USER: appuser
      DB_PASSWORD: apppass
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: csv_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d csv_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:6.1.2-standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data: